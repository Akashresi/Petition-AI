name: PetitionAI CI

on:
  push:
    branches: [main, "upgrade/all"]
  pull_request:
    branches: [main, "upgrade/all"]

jobs:
  frontend:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest unit tests
        run: npm run test

      - name: Build frontend for production
        run: npm run build

  backend:
    name: Backend (Pytest Suite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Run Ruff Linter
        working-directory: backend
        run: |
          ruff check app/ tests/

      - name: Run pytest suites
        working-directory: backend
        env:
          USE_MONGODB: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SECRET_KEY: "ci-secret-key-that-is-at-least-32-bytes-long"
          ENV: "test"
        run: |
          pytest tests/test_ai_router.py tests/test_auth.py tests/test_complaints.py tests/test_ai_engine.py tests/test_evaluation.py tests/test_closure_and_leaderboard.py tests/test_webhooks.py -v
